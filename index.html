<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ProCut — Gestão e Tela de Corte Precisa</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --accent-hover: #0284c7;
            --piece-bg: #ffffff;
            --piece-border: #0f172a;
            --success: #22c55e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            min-height: 100vh;
        }

        /* --- TELA DE LOGIN --- */
        #login-screen {
            position: fixed;
            inset: 0;
            background: var(--bg-color);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 999;
        }

        .login-card {
            background: var(--panel-bg);
            padding: 35px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            width: 100%;
            max-width: 380px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            text-align: center;
        }

        .login-card h2 {
            margin-bottom: 5px;
            font-size: 1.5rem;
        }

        .login-card p {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-bottom: 20px;
        }

        .form-group {
            margin-bottom: 15px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background: #090d16;
            color: var(--text-main);
            outline: none;
        }

        .btn {
            width: 100%;
            padding: 10px;
            background: #0284c7;
            color: white;
            border: none;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn:hover { background: #0369a1; }

        .btn-google {
            background: #ffffff;
            color: #000000;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-top: 10px;
        }

        .btn-google:hover { background: #e2e8f0; }

        .divider {
            margin: 15px 0;
            font-size: 0.75rem;
            color: var(--text-muted);
            position: relative;
        }

        /* --- LAYOUT PRINCIPAL --- */
        #app {
            display: none;
            flex-direction: column;
            min-height: 100vh;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 30px;
            border-bottom: 1px solid var(--border-color);
        }

        .nav-tabs {
            display: flex;
            gap: 10px;
        }

        .tab-btn {
            background: transparent;
            border: none;
            color: var(--text-muted);
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
        }

        .tab-btn.active {
            background: var(--border-color);
            color: var(--text-main);
        }

        .user-info {
            font-size: 0.85rem;
            color: var(--text-muted);
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .logout-btn {
            background: transparent;
            color: #ef4444;
            border: 1px solid #ef4444;
            padding: 4px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.8rem;
        }

        main {
            padding: 25px;
            flex-grow: 1;
        }

        .tab-content { display: none; }
        .tab-content.active { display: block; }

        /* --- PAINEL E TELA DE CORTE (ESCALA REDUZIDA 1cm = 3px) --- */
        .controls-panel {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 15px;
            align-items: flex-end;
            flex-wrap: wrap;
        }

        .simulator-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 30px;
            display: flex;
            justify-content: center;
        }

        /* 140cm x 3px/cm = 420px de largura | 100cm x 3px/cm = 300px de altura */
        .canvas-container {
            position: relative;
            background: #090d16;
            border: 1px solid var(--border-color);
            margin-top: 30px;
            margin-left: 40px;
            width: 420px; 
            height: 300px;
        }

        .ruler-top {
            position: absolute;
            top: -25px;
            left: 0;
            width: 420px;
            height: 25px;
            background: #111827;
            border-bottom: 1px solid var(--border-color);
        }

        .ruler-top-mark {
            position: absolute;
            font-size: 9px;
            color: var(--text-muted);
            transform: translateX(-50%);
            top: 5px;
            width: 30px;
            text-align: center;
        }

        .ruler-left {
            position: absolute;
            top: 0;
            left: -40px;
            width: 40px;
            height: 300px;
            background: #111827;
            border-right: 1px solid var(--border-color);
        }

        .ruler-left-mark {
            position: absolute;
            font-size: 9px;
            color: var(--text-muted);
            transform: translateY(-50%);
            right: 5px;
            text-align: right;
            width: 30px;
        }

        .piece {
            position: absolute;
            background: var(--piece-bg);
            border: 1px solid var(--piece-border);
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            font-size: 9px;
            font-weight: bold;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.1);
            overflow: hidden;
            text-align: center;
            line-height: 1.1;
        }

        /* --- TABLES --- */
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
        }

        th, td {
            padding: 12px 15px;
            text-align: left;
            border-bottom: 1px solid var(--border-color);
            font-size: 0.85rem;
        }

        th { background: #111827; color: var(--text-muted); }
    </style>
</head>
<body>

    <!-- LOGIN (E-mail + Google) -->
    <div id="login-screen">
        <div class="login-card">
            <h2>ProCut</h2>
            <p>Acesse sua conta para continuar</p>
            <form id="login-form">
                <div class="form-group">
                    <label>E-mail</label>
                    <input type="email" id="user-email" placeholder="seu@email.com" required>
                </div>
                <div class="form-group">
                    <label>Perfil</label>
                    <select id="user-role">
                        <option value="Operador de Corte">Operador de Corte</option>
                        <option value="Administrador">Administrador</option>
                    </select>
                </div>
                <button type="submit" class="btn">Entrar com E-mail</button>
            </form>

            <div class="divider">OU</div>

            <button class="btn btn-google" onclick="loginGoogle()">
                <svg width="16" height="16" viewBox="0 0 24 24"><path fill="#4285F4" d="M23.745 12.27c0-.7-.06-1.4-.19-2.07H12v4.51h6.6c-.29 1.52-1.14 2.82-2.4 3.68v3.05h3.88c2.27-2.09 3.665-5.17 3.665-9.17z"/><path fill="#34A853" d="M12 24c3.24 0 5.95-1.08 7.93-2.91l-3.88-3.05c-1.08.72-2.45 1.16-4.05 1.16-3.12 0-5.77-2.11-6.72-4.96H1.29v3.15C3.26 21.3 7.33 24 12 24z"/><path fill="#FBBC05" d="M5.28 14.24c-.25-.72-.38-1.49-.38-2.24s.13-1.52.38-2.24V6.61H1.29C.47 8.24 0 10.06 0 12s.47 3.76 1.29 5.39l3.99-3.15z"/><path fill="#EA4335" d="M12 4.75c1.77 0 3.35.61 4.6 1.8l3.42-3.42C17.95 1.19 15.24 0 12 0 7.33 0 3.26 2.7 1.29 6.61l3.99 3.15c.95-2.85 3.6-4.96 6.72-4.96z"/></svg>
                Entrar com Google
            </button>
        </div>
    </div>

    <!-- MAIN APP -->
    <div id="app">
        <header>
            <h2>ProCut System</h2>
            <div class="nav-tabs">
                <button class="tab-btn active" onclick="switchTab('corte')">Tela de Corte</button>
                <button class="tab-btn" onclick="switchTab('bobinas')">Bobinas</button>
                <button class="tab-btn" onclick="switchTab('ordens')">Ordens de Serviço</button>
            </div>
            <div class="user-info">
                <span id="display-user">usuario@email.com</span> (<span id="display-role">Operador</span>)
                <button class="logout-btn" onclick="logout()">Sair</button>
            </div>
        </header>

        <main>
            <!-- ABA: TELA DE CORTE -->
            <section id="tab-corte" class="tab-content active">
                <div class="controls-panel">
                    <div class="form-group" style="margin:0; width: 120px;">
                        <label>Largura (cm)</label>
                        <input type="number" id="piece-w" value="130">
                    </div>
                    <div class="form-group" style="margin:0; width: 120px;">
                        <label>Altura (cm)</label>
                        <input type="number" id="piece-h" value="20">
                    </div>
                    <button class="btn" style="width: auto;" onclick="adicionarPeca()">Desenhar Peça</button>
                    <button class="btn" style="width: auto; background: #dc2626;" onclick="limparTela()">Limpar Canvas</button>
                    <div style="font-size: 0.8rem; color: var(--text-muted); margin-left: auto;">
                        Escala: Precision Compact (1cm = 3px) | Bobina: 140cm
                    </div>
                </div>

                <div class="simulator-wrapper">
                    <div class="canvas-container" id="canvas">
                        <div class="ruler-top" id="rulerTop"></div>
                        <div class="ruler-left" id="rulerLeft"></div>
                    </div>
                </div>
            </section>

            <!-- ABA: BOBINAS -->
            <section id="tab-bobinas" class="tab-content">
                <table>
                    <thead>
                        <tr><th>ID</th><th>Material</th><th>Largura</th><th>Restante</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>#BOB-01</td><td>Adesivo Vinil Brilho</td><td>140 cm</td><td>45.0 m</td><td style="color:var(--success)">Em Uso</td></tr>
                    </tbody>
                </table>
            </section>

            <!-- ABA: OS -->
            <section id="tab-ordens" class="tab-content">
                <table>
                    <thead>
                        <tr><th>OS #</th><th>Cliente</th><th>Dimensões</th><th>Status</th></tr>
                    </thead>
                    <tbody>
                        <tr><td>#1001</td><td>Comércio Local</td><td>130 x 20 cm</td><td>Aguardando</td></tr>
                    </tbody>
                </table>
            </section>
        </main>
    </div>

    <script>
        // ESCALA REDUZIDA E PRECISA: 1cm = 3px (Bobina 140cm = 420px)
        const SCALE = 3; 
        const BOBINA_LARGURA_CM = 140;
        let currentX = 0;
        let pieceCount = 0;

        // Login Email
        document.getElementById('login-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('user-email').value;
            const role = document.getElementById('user-role').value;
            startApp(email, role);
        });

        // Login Google Simulado
        function loginGoogle() {
            startApp("usuario.google@gmail.com", "Administrador");
        }

        function startApp(user, role) {
            document.getElementById('display-user').innerText = user;
            document.getElementById('display-role').innerText = role;
            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('app').style.display = 'flex';
            initRulers();
        }

        function logout() {
            document.getElementById('login-screen').style.display = 'flex';
            document.getElementById('app').style.display = 'none';
            limparTela();
        }

        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(tab => tab.classList.remove('active'));

            event.target.classList.add('active');
            document.getElementById(`tab-${tabId}`).classList.add('active');
        }

        // Inicializar Réguas Precisas nas medidas da escala
        function initRulers() {
            const rulerTop = document.getElementById('rulerTop');
            const rulerLeft = document.getElementById('rulerLeft');
            rulerTop.innerHTML = '';
            rulerLeft.innerHTML = '';

            // Régua X (de 20 em 20 cm)
            for (let cm = 0; cm <= BOBINA_LARGURA_CM; cm += 20) {
                const mark = document.createElement('div');
                mark.className = 'ruler-top-mark';
                mark.style.left = (cm * SCALE) + 'px';
                mark.innerText = cm;
                rulerTop.appendChild(mark);
            }

            // Régua Y (de 20 em 20 cm)
            for (let cm = 0; cm <= 100; cm += 20) {
                const mark = document.createElement('div');
                mark.className = 'ruler-left-mark';
                mark.style.top = (cm * SCALE) + 'px';
                mark.innerText = cm;
                rulerLeft.appendChild(mark);
            }
        }

        // Adicionar Peça com Escala Precisa
        function adicionarPeca() {
            const w = parseFloat(document.getElementById('piece-w').value);
            const h = parseFloat(document.getElementById('piece-h').value);

            if (currentX + w > BOBINA_LARGURA_CM) {
                alert(`A peça de ${w}cm ultrapassa a largura máxima da bobina! Restante disponível: ${BOBINA_LARGURA_CM - currentX}cm.`);
                return;
            }

            pieceCount++;
            const canvas = document.getElementById('canvas');
            const el = document.createElement('div');
            el.className = 'piece';

            // Posição e escala matemáticas corretas
            el.style.left = (currentX * SCALE) + 'px';
            el.style.top = '0px';
            el.style.width = (w * SCALE) + 'px';
            el.style.height = (h * SCALE) + 'px';

            el.innerHTML = `#${pieceCount}<br>${w}x${h}cm`;

            canvas.appendChild(el);
            currentX += w;
        }

        function limparTela() {
            const canvas = document.getElementById('canvas');
            document.querySelectorAll('.piece').forEach(p => p.remove());
            currentX = 0;
            pieceCount = 0;
        }
    </script>
</body>
</html>
