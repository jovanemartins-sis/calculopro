<!-- Grupo de Botões de Reorganização -->
<div class="button-group">

  <!-- Botão 1: Máximo Espaço -->
  <button class="btn btn-mode-max active" onclick="setMode('max')">
    <i data-lucide="maximize-2"></i>
    <div>
      <strong>1. Preencher Máximo Espaço</strong>
      <span class="btn-desc">Rotaciona e encaixa em todos os cantos livre (Padrão)</span>
    </div>
  </button>

  <!-- Botão 2: Facilitar Corte -->
  <button class="btn btn-mode-cut" onclick="setMode('cut')">
    <i data-lucide="scissors"></i>
    <div>
      <strong>2. Facilitar o Corte</strong>
      <span class="btn-desc">Alinha em guilhotina com linhas retas contínuas</span>
    </div>
  </button>

  <!-- Botão Auxiliar: Reorganizar / Gerar -->
  <button class="btn btn-secondary" onclick="regenerateParts()">
    <i data-lucide="shuffle"></i>
    Reorganizar Chapa
  </button>

</div>
