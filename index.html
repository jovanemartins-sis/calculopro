<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Corte - Simulador de Bobina</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --piece-bg: #ffffff;
            --piece-border: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text-main);
        }

        .info-bar {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .info-bar span {
            color: var(--accent);
            font-weight: 500;
        }

        .actions {
            display: flex;
            gap: 10px;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }

        button:hover {
            background: #0369a1;
        }

        /* Área do Simulador */
        .simulator-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        .canvas-container {
            position: relative;
            background: #090d16;
            border: 2px solid var(--border-color);
            margin-top: 30px;
            margin-left: 35px;
            width: 1400px; 
            height: 400px;
        }

        /* Réguas */
        .ruler-top {
            position: absolute;
            top: -30px;
            left: 0;
            width: 1400px;
            height: 25px;
            background: #111827;
            border-bottom: 1px solid var(--border-color);
            display: flex;
        }

        .ruler-top-mark {
            position: absolute;
            font-size: 10px;
            color: var(--text-muted);
            transform: translateX(-50%);
            top: 5px;
        }

        .ruler-left {
            position: absolute;
            top: 0;
            left: -35px;
            width: 30px;
            height: 400px;
            background: #111827;
            border-right: 1px solid var(--border-color);
        }

        .ruler-left-mark {
            position: absolute;
            font-size: 10px;
            color: var(--text-muted);
            transform: translateY(-50%);
            right: 5px;
            text-align: right;
            width: 25px;
        }

        /* Peças na Tela de Corte */
        .piece {
            position: absolute;
            background: var(--piece-bg);
            border: 1px solid var(--piece-border);
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 6px;
            font-size: 11px;
            box-shadow: inset 0 0 0 1px rgba(0,0,0,0.05);
        }

        .piece-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #334155;
            border-bottom: 1px solid #e2e8f0;
            padding-bottom: 2px;
        }

        .piece-body {
            text-align: center;
            font-weight: 600;
            color: #0f172a;
            margin: auto 0;
        }

        .piece-footer {
            font-size: 9px;
            color: #64748b;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tela de Corte — Otimização de Bobina</h1>
            <div class="info-bar">
                <div>Bobina: <span>140 cm</span></div>
                <div>Escala Limpa e Direta</div>
            </div>
            <div class="actions">
                <button onclick="window.print()">Exportar / Imprimir</button>
            </div>
        </header>

        <div class="simulator-wrapper">
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">
                Origem (0,0 no canto superior esquerdo) | Cada bloco representa perfeitamente o posicionamento real na máquina.
            </div>

            <div class="canvas-container" id="canvas">
                <!-- Régua Superior (Eixo X de 5 em 5 cm até 140cm) -->
                <div class="ruler-top" id="rulerTop"></div>

                <!-- Régua Lateral (Eixo Y de 5 em 5 cm) -->
                <div class="ruler-left" id="rulerLeft"></div>

                <!-- As peças serão injetadas limpas aqui via script -->
            </div>
        </div>
    </div>

    <script>
        const scale = 10; 
        const maxWidth = 140; // 140 cm da bobina

        // Criar Marcações da Régua Superior (X)
        const rulerTop = document.getElementById('rulerTop');
        for (let i = 0; i <= maxWidth; i += 5) {
            if (i % 10 === 0) { 
                const mark = document.createElement('div');
                mark.className = 'ruler-top-mark';
                mark.style.left = (i * scale) + 'px';
                mark.innerText = i;
                rulerTop.appendChild(mark);
            }
        }

        // Criar Marcações da Régua Lateral (Y)
        const rulerLeft = document.getElementById('rulerLeft');
        for (let i = 0; i <= 40; i += 5) {
            const mark = document.createElement('div');
            mark.className = 'ruler-left-mark';
            mark.style.top = (i * scale) + 'px';
            mark.innerText = i;
            rulerLeft.appendChild(mark);
        }

        // Renderização Limpa das Peças
        const canvas = document.getElementById('canvas');
        
        const pieceWidth = 20;  // 20 cm
        const pieceHeight = 5;  // 5 cm

        let index = 1;
        for (let row = 0; row < 2; row++) {
            for (let col = 0; col < 7; col++) {
                const piece = document.createElement('div');
                piece.className = 'piece';
                
                const posX = col * pieceWidth;
                const posY = row * pieceHeight;

                piece.style.left = (posX * scale) + 'px';
                piece.style.top = (posY * scale) + 'px';
                piece.style.width = (pieceWidth * scale) + 'px';
                piece.style.height = (pieceHeight * scale) + 'px';

                piece.innerHTML = `
                    <div class="piece-header">
                        <span>#${index}</span>
                        <span>${pieceWidth}x${pieceHeight}</span>
                    </div>
                    <div class="piece-body">Corte</div>
                    <div class="piece-footer">X:${posX} Y:${posY}</div>
                `;
                canvas.appendChild(piece);
                index++;
            }
        }
    </script>
</body>
</html>
