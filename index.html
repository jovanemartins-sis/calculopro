<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela de Corte - Precisão e Escala</title>
    <style>
        /* 1. RESET E REGRA GOLDEN DE TAMANHO (Impede que bordas deformem o tamanho da peça) */
        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        :root {
            --bg-color: #0f172a;
            --panel-bg: #1e293b;
            --border-color: #334155;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #38bdf8;
            --piece-bg: #ffffff;
            --piece-border: #000000;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--panel-bg);
            padding: 15px 25px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            margin-bottom: 20px;
        }

        h1 {
            font-size: 1.2rem;
            color: var(--text-main);
        }

        .info-bar {
            display: flex;
            gap: 20px;
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .info-bar span {
            color: var(--accent);
            font-weight: bold;
        }

        button {
            background: #0284c7;
            color: white;
            border: none;
            padding: 8px 16px;
            border-radius: 6px;
            font-weight: 600;
            cursor: pointer;
        }

        button:hover {
            background: #0369a1;
        }

        .simulator-wrapper {
            background: var(--panel-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            padding: 20px;
            overflow-x: auto;
        }

        /* 2. ÁREA DE DESENHO (CANVAS) */
        .canvas-container {
            position: relative;
            background: #090d16;
            border: 1px solid var(--border-color);
            margin-top: 40px;
            margin-left: 50px;
            width: 1400px; /* 140cm x 10px/cm */
            height: 300px;
        }

        /* 3. RÉGUA SUPERIOR (EIXO X) */
        .ruler-top {
            position: absolute;
            top: -30px;
            left: 0;
            width: 1400px;
            height: 30px;
            background: #111827;
            border-bottom: 2px solid var(--accent);
        }

        .ruler-top-mark {
            position: absolute;
            font-size: 11px;
            color: var(--text-muted);
            transform: translateX(-50%); /* Garante alinhamento exato no centro do pixel */
            top: 6px;
            width: 40px;
            text-align: center;
        }

        .ruler-top-tick {
            position: absolute;
            bottom: 0;
            width: 1px;
            height: 6px;
            background: var(--border-color);
            transform: translateX(-50%);
        }

        /* 4. RÉGUA LATERAL (EIXO Y) */
        .ruler-left {
            position: absolute;
            top: 0;
            left: -50px;
            width: 50px;
            height: 300px;
            background: #111827;
            border-right: 2px solid var(--accent);
        }

        .ruler-left-mark {
            position: absolute;
            font-size: 11px;
            color: var(--text-muted);
            transform: translateY(-50%); /* Centraliza o número verticalmente */
            right: 8px;
            text-align: right;
            width: 35px;
        }

        /* 5. PEÇAS DESENHADAS */
        .piece {
            position: absolute;
            background: var(--piece-bg);
            border: 2px solid var(--piece-border); /* Borda inclusa no tamanho real devido ao box-sizing */
            color: #000;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 4px 6px;
            font-size: 11px;
            overflow: hidden;
        }

        .piece-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            color: #1e293b;
            border-bottom: 1px dashed #cbd5e1;
            padding-bottom: 2px;
            font-size: 10px;
        }

        .piece-body {
            text-align: center;
            font-weight: 700;
            color: #0f172a;
            margin: auto 0;
        }

        .piece-footer {
            font-size: 9px;
            color: #64748b;
            text-align: right;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Tela de Corte — Precisão de Escala</h1>
            <div class="info-bar">
                <div>Bobina: <span>140 cm</span></div>
                <div>Escala: <span>1 cm = 10 px</span></div>
            </div>
            <div>
                <button onclick="window.print()">Imprimir / Exportar</button>
            </div>
        </header>

        <div class="simulator-wrapper">
            <div style="font-size: 0.85rem; color: var(--text-muted); margin-bottom: 10px;">
                Escala corrigida com <code>box-sizing: border-box</code>. O fim da peça de 130cm coincide com o traço 130 da régua.
            </div>

            <div class="canvas-container" id="canvas">
                <div class="ruler-top" id="rulerTop"></div>
                <div class="ruler-left" id="rulerLeft"></div>
            </div>
        </div>
    </div>

    <script>
        // Escala Base: 1 cm real = 10 pixels no CSS
        const SCALE = 10;
        const BOBINA_LARGURA_CM = 140;

        // 1. GERAR RÉGUA SUPERIOR (EIXO X)
        const rulerTop = document.getElementById('rulerTop');
        for (let cm = 0; cm <= BOBINA_LARGURA_CM; cm += 5) {
            const posX = cm * SCALE;

            // Traço visual da régua
            const tick = document.createElement('div');
            tick.className = 'ruler-top-tick';
            tick.style.left = posX + 'px';
            rulerTop.appendChild(tick);

            // Números impresso de 10 em 10 cm para legibilidade
            if (cm % 10 === 0) {
                const mark = document.createElement('div');
                mark.className = 'ruler-top-mark';
                mark.style.left = posX + 'px';
                mark.innerText = cm;
                rulerTop.appendChild(mark);
            }
        }

        // 2. GERAR RÉGUA LATERAL (EIXO Y)
        const rulerLeft = document.getElementById('rulerLeft');
        for (let cm = 0; cm <= 30; cm += 5) {
            const posY = cm * SCALE;
            const mark = document.createElement('div');
            mark.className = 'ruler-left-mark';
            mark.style.top = posY + 'px';
            mark.innerText = cm;
            rulerLeft.appendChild(mark);
        }

        // 3. DESENHAR PEÇAS NA TELA DE CORTE (130cm + 10cm = 140cm)
        const canvas = document.getElementById('canvas');

        const pecas = [
            { id: 1, larguraCm: 130, alturaCm: 20, xCm: 0,   yCm: 0 },
            { id: 2, larguraCm: 10,  alturaCm: 20, xCm: 130, yCm: 0 }
        ];

        pecas.forEach(p => {
            const el = document.createElement('div');
            el.className = 'piece';

            // Posição e dimensões exatas escaladas
            el.style.left = (p.xCm * SCALE) + 'px';
            el.style.top = (p.yCm * SCALE) + 'px';
            el.style.width = (p.larguraCm * SCALE) + 'px';
            el.style.height = (p.alturaCm * SCALE) + 'px';

            el.innerHTML = `
                <div class="piece-header">
                    <span>#${p.id}</span>
                    <span>${p.larguraCm}x${p.alturaCm}cm</span>
                </div>
                <div class="piece-body">${p.larguraCm >= 20 ? 'Desenho / Corte' : ''}</div>
                <div class="piece-footer">X:${p.xCm} Y:${p.yCm}</div>
            `;

            canvas.appendChild(el);
        });
    </script>
</body>
</html>
