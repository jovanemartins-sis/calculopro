<script type="module">
    // Importa as funções do Realtime Database do Firebase v10
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, get, child, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Configuração apontando para o seu projeto calculo-pro
    const firebaseConfig = {
      databaseURL: "https://calculo-pro-default-rtdb.firebaseio.com"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    window.db = db;

    window.appData = {
      clientes: [],
      fornecedores: [],
      suprimentos: [{"id":1, "nome":"Bobina Lona 1.35m", "largura":135, "preco":25.00}, {"id":2, "nome":"Bobina Adesivo 1.00m", "largura":100, "preco":18.50}],
      escalaZoom: 2.5
    };

    window.addEventListener('DOMContentLoaded', async () => {
      verificarSessao();
      await carregarDadosDoFirebase();
      atualizarSelectBobinas();
      renderizarTabelas();
      atualizarSelectClientes();
      addParteExemplo("Peça 1", 120, 50, 4);
      addParteExemplo("Peça 2", 10, 20, 4);
    });

    // Função blindada para evitar erros de tela branca
    function verificarSessao() {
      const auth = document.getElementById('authModal');
      const app = document.getElementById('appContainer');
      if (auth) auth.classList.add('hidden');
      if (app) app.classList.remove('hidden');
    }

    window.fazerLogin = function() { verificarSessao(); }
    window.fazerLogout = function() { alert("Sessão encerrada"); }

    window.mudarAba = function(abaId) {
      ['dados', 'clientes', 'fornecedores', 'suprimentos', 'desenho'].forEach(aba => {
        const el = document.getElementById('aba' + aba.charAt(0).toUpperCase() + aba.slice(1));
        const btn = document.getElementById('btnAba' + aba.charAt(0).toUpperCase() + aba.slice(1));
        if (el) el.classList.toggle('hidden', aba !== abaId);
        if (btn) btn.className = aba === abaId 
          ? "px-2.5 py-1.5 rounded text-[10px] font-medium bg-cyan-600 text-white transition cursor-pointer shadow whitespace-nowrap flex items-center justify-start"
          : "px-2.5 py-1.5 rounded text-[10px] font-medium bg-slate-800 text-slate-300 hover:bg-slate-700 transition cursor-pointer whitespace-nowrap flex items-center justify-start";
      });
    }

    window.fecharModal = function() {
      document.getElementById('modalDinamico').classList.add('hidden');
    }

    // 1. CARREGAR DADOS DO REALTIME DATABASE
    async function carregarDadosDoFirebase() {
      try {
        const dbRef = ref(window.db);
        
        const snapshotClientes = await get(child(dbRef, 'clientes'));
        if (snapshotClientes.exists()) {
          window.appData.clientes = [];
          snapshotClientes.forEach((childSnap) => {
            window.appData.clientes.push({ id: childSnap.key, ...childSnap.val() });
          });
        }

        const snapshotFornecedores = await get(child(dbRef, 'fornecedores'));
        if (snapshotFornecedores.exists()) {
          window.appData.fornecedores = [];
          snapshotFornecedores.forEach((childSnap) => {
            window.appData.fornecedores.push({ id: childSnap.key, ...childSnap.val() });
          });
        }

        const snapshotSuprimentos = await get(child(dbRef, 'suprimentos'));
        if (snapshotSuprimentos.exists()) {
          window.appData.suprimentos = [];
          snapshotSuprimentos.forEach((childSnap) => {
            window.appData.suprimentos.push({ id: childSnap.key, ...childSnap.val() });
          });
        }
      } catch (e) {
        console.error("Erro ao carregar do Realtime Database:", e);
      }
    }

    // 2. SALVAR CLIENTE NO REALTIME DATABASE
    window.abrirModalCliente = function() {
      document.getElementById('modalTitulo').textContent = 'Novo Cliente';
      document.getElementById('modalCorpo').innerHTML = `
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Nome Completo / Razão Social</label><input type="text" id="mNome" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">CPF / CNPJ</label><input type="text" id="mDoc" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Telefone / WhatsApp</label><input type="text" id="mTel" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
      `;
      
      const btn = document.getElementById('btnSalvarModal');
      btn.onclick = async function() {
        const nome = document.getElementById('mNome').value;
        if (!nome) return alert('Informe o nome do cliente!');
        
        const novo = {
          nome: nome,
          doc: document.getElementById('mDoc').value,
          tel: document.getElementById('mTel').value,
          criadoEm: new Date().toISOString()
        };

        try {
          const novaRef = push(ref(window.db, 'clientes'));
          await set(novaRef, novo);
          
          window.appData.clientes.push({ id: novaRef.key, ...novo });
          renderizarTabelas();
          atualizarSelectClientes();
          fecharModal();
          alert("Cliente salvo no Realtime Database com sucesso!");
        } catch (e) {
          console.error(e);
          alert("Erro ao salvar no banco de dados.");
        }
      };
      document.getElementById('modalDinamico').classList.remove('hidden');
    }

    // 3. SALVAR FORNECEDOR NO REALTIME DATABASE
    window.abrirModalFornecedor = function() {
      document.getElementById('modalTitulo').textContent = 'Novo Fornecedor';
      document.getElementById('modalCorpo').innerHTML = `
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Empresa / Razão Social</label><input type="text" id="mEmpresa" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">CNPJ</label><input type="text" id="mCNPJ" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Contato</label><input type="text" id="mContato" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
      `;
      
      const btn = document.getElementById('btnSalvarModal');
      btn.onclick = async function() {
        const empresa = document.getElementById('mEmpresa').value;
        if (!empresa) return alert('Informe o nome da empresa!');
        
        const novo = {
          empresa: empresa,
          cnpj: document.getElementById('mCNPJ').value,
          contato: document.getElementById('mContato').value,
          criadoEm: new Date().toISOString()
        };

        try {
          const novaRef = push(ref(window.db, 'fornecedores'));
          await set(novaRef, novo);

          window.appData.fornecedores.push({ id: novaRef.key, ...novo });
          renderizarTabelas();
          fecharModal();
          alert("Fornecedor salvo no Realtime Database com sucesso!");
        } catch (e) {
          console.error(e);
          alert("Erro ao salvar no banco de dados.");
        }
      };
      document.getElementById('modalDinamico').classList.remove('hidden');
    }

    // 4. SALVAR SUPRIMENTO NO REALTIME DATABASE
    window.abrirModalSuprimento = function() {
      document.getElementById('modalTitulo').textContent = 'Novo Suprimento / Bobina';
      document.getElementById('modalCorpo').innerHTML = `
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Nome do Material (Ex: Lona 440g)</label><input type="text" id="mNome" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Largura (cm)</label><input type="number" id="mLargura" placeholder="Ex: 135" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
        <div><label class="block text-[10px] font-bold text-slate-600 mb-1">Preço do Metro (R$)</label><input type="number" step="0.01" id="mPreco" placeholder="Ex: 25.00" class="w-full bg-slate-50 border p-2 text-xs rounded outline-none focus:border-cyan-500"></div>
      `;
      
      const btn = document.getElementById('btnSalvarModal');
      btn.onclick = async function() {
        const nome = document.getElementById('mNome').value;
        const largura = parseFloat(document.getElementById('mLargura').value);
        const preco = parseFloat(document.getElementById('mPreco').value);

        if (!nome || !largura) return alert('Informe o nome e a largura do material!');

        const novo = { nome, largura, preco: preco || 0, criadoEm: new Date().toISOString() };

        try {
          const novaRef = push(ref(window.db, 'suprimentos'));
          await set(novaRef, novo);

          window.appData.suprimentos.push({ id: novaRef.key, ...novo });
          atualizarSelectBobinas();
          renderizarTabelas();
          fecharModal();
          alert("Suprimento salvo no Realtime Database com sucesso!");
        } catch (e) {
          console.error(e);
          alert("Erro ao salvar no banco de dados.");
        }
      };
      document.getElementById('modalDinamico').classList.remove('hidden');
    }

    function renderizarTabelas() {
      const tbodyC = document.getElementById('tabelaClientes');
      if(tbodyC) {
        tbodyC.innerHTML = window.appData.clientes.length === 0 ? '<tr><td colspan="4" class="p-3 text-center text-slate-400">Nenhum cliente cadastrado.</td></tr>' : '';
        window.appData.clientes.forEach((c) => {
          tbodyC.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-2 font-bold">${c.nome}</td><td class="p-2">${c.doc||'-'}</td><td class="p-2">${c.tel||'-'}</td><td class="p-2 text-center">-</td></tr>`;
        });
      }

      const tbodyF = document.getElementById('tabelaFornecedores');
      if(tbodyF) {
        tbodyF.innerHTML = window.appData.fornecedores.length === 0 ? '<tr><td colspan="4" class="p-3 text-center text-slate-400">Nenhum fornecedor cadastrado.</td></tr>' : '';
        window.appData.fornecedores.forEach((f) => {
          tbodyF.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-2 font-bold">${f.empresa}</td><td class="p-2">${f.cnpj||'-'}</td><td class="p-2">${f.contato||'-'}</td><td class="p-2 text-center">-</td></tr>`;
        });
      }

      const tbodyS = document.getElementById('tabelaSuprimentos');
      if(tbodyS) {
        tbodyS.innerHTML = window.appData.suprimentos.length === 0 ? '<tr><td colspan="4" class="p-3 text-center text-slate-400">Nenhum suprimento cadastrado.</td></tr>' : '';
        window.appData.suprimentos.forEach((s) => {
          tbodyS.innerHTML += `<tr class="hover:bg-slate-50"><td class="p-2 font-bold">${s.nome}</td><td class="p-2">${s.largura} cm</td><td class="p-2">R$ ${Number(s.preco).toFixed(2)}</td><td class="p-2 text-center">-</td></tr>`;
        });
      }
    }

    function atualizarSelectClientes() {
      const select = document.getElementById('selectClienteOrcamento');
      if(select) {
        select.innerHTML = '<option value="">-- Selecione o Cliente --</option>';
        window.appData.clientes.forEach(c => {
          select.innerHTML += `<option value="${c.nome}">${c.nome}</option>`;
        });
      }
    }

    function atualizarSelectBobinas() {
      const select = document.getElementById('selectBobinaGlobal');
      if(select) {
        select.innerHTML = '';
        window.appData.suprimentos.forEach(sup => {
          const opt = document.createElement('option');
          opt.value = sup.largura;
          opt.dataset.preco = sup.preco;
          opt.textContent = `${sup.nome} - Largura: ${sup.largura}cm (R$ ${Number(sup.preco).toFixed(2)}/m)`;
          select.appendChild(opt);
        });
      }
    }

    window.addParteVazia = function() { addParteExemplo('', '', '', 1); }

    window.addParteExemplo = function(nome, largura, comp, qtd) {
      const tbody = document.getElementById('partes');
      if(tbody) {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td class="p-2"><input type="text" value="${nome}" placeholder="Nome da peça" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs parte-nome"></td>
          <td class="p-2"><input type="number" value="${largura}" placeholder="0" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs parte-largura"></td>
          <td class="p-2"><input type="number" value="${comp}" placeholder="0" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs parte-comprimento"></td>
          <td class="p-2"><input type="number" value="${qtd}" class="w-full bg-slate-50 border border-slate-300 rounded px-2 py-1 text-xs parte-qtd"></td>
          <td class="p-2 text-center"><button type="button" onclick="this.closest('tr').remove()" class="text-red-500 font-bold"><i class="fa-solid fa-trash text-[8px]"></i></button></td>
        `;
        tbody.appendChild(tr);
      }
    }

    window.processarECalcular = function() {
      alert("Módulo de cálculo e desenho pronto. Adicione suas peças e clique em calcular!");
      window.mudarAba('desenho');
    }

    window.calcularCustos = function() {
      alert("Custos calculados com sucesso!");
    }

    window.alterarZoom = function(valor) {
      window.appData.escalaZoom = Math.max(1, window.appData.escalaZoom + valor);
      const lbl = document.getElementById('labelZoom');
      if(lbl) lbl.textContent = window.appData.escalaZoom.toFixed(1) + 'x';
    }
  </script>
